<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Register</title>
    <link rel="stylesheet" href="/css/user.css">
</head>
<body>
    <header class="navbar">
        <div class="brand"><span class="dot"></span>BoardGameStat</div>
        <div class="nav-actions">
            <a href="/login" class="btn-ghost">Log in</a>
        </div>
    </header>

    <div class="container auth-wrap">
        <div class="card">
            <div class="auth-title">
                <div class="title">Create account</div>
                <div class="subtitle muted">Join the community</div>
            </div>

            <form method="post" th:action="@{/register}">
                <!-- CSRF (Spring Security). Uncomment if CSRF is enabled -->
                <!-- <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" /> -->

                <div class="row">
                    <label for="username">Username</label>
                    <input id="username" name="userName" type="text" required autocomplete="username" />
                </div>

                <div class="row">
                    <label for="displayname">Display name</label>
                    <input id="displayname" name="displayName" type="text" required autocomplete="name" />
                </div>

                <div class="row">
                    <label for="email">Email</label>
                    <input id="email" name="email" type="email" required autocomplete="email" />
                </div>

                <div class="row">
                    <label for="password">Password</label>
                    <input id="password" name="password" type="password" required autocomplete="new-password" />
                </div>

                <div class="actions">
                    <button type="submit" class="btn-primary">Sign up</button>
                    <a href="/login" class="btn-ghost">Log in</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
