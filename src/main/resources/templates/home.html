<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Home - Game App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        header {
            font-size: 1.5em;
            margin-bottom: 20px;
        }
        section {
            margin-bottom: 30px;
        }
        h2 {
            margin-bottom: 10px;
            color: #333;
        }
        .box {
            border: 1px solid #ccc;
            padding: 15px;
            border-radius: 6px;
            background-color: #f9f9f9;
        }
    </style>
</head>
<body>

<header>
    Hi, <span th:text="${user.username}">Username</span>
</header>

<section id="games">
    <h2>Games</h2>
    <div class="box">
        <p>List of available games will appear here.</p>
    </div>
</section>

<section id="groups">
    <h2>Groups</h2>
    <div class="box">
        <p>Information about your groups will appear here.</p>
    </div>
</section>

<section id="stats">
    <h2>Stats</h2>
    <div class="box">
        <p>Your game statistics will appear here.</p>
    </div>
</section>

</body>
</html>
