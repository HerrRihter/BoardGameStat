<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Home - Game App</title>
    <link rel="stylesheet" href="/css/user.css">
</head>
<body class="home">
    <div th:replace="fragments/header :: appHeader('Home')"></div>

    <div class="container">
        <div class="grid">
            <div th:replace="fragments/sidebar :: appSidebar('home')"></div>
            <section class="content">
                <div class="card">
                    <div class="title">Welcome back, <span th:text="${user.displayName}">Username</span>!</div>
                    <div class="subtitle" th:text="${'@' + user.username}">@username</div>
                </div>

                

                <div id="groups" class="card">
                    <div class="title">Groups</div>
                    <p>Information about your groups will appear here.</p>
                </div>

                <div id="stats" class="card">
                    <div class="title">Stats</div>
                    <p>Your game statistics will appear here.</p>
                </div>
            </section>
        </div>
    </div>
</body>
</html>
