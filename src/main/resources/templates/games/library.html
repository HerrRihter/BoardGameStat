<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Game Library</title>
    <link rel="stylesheet" href="/css/user.css">
    <style>
        .games-list { display: grid; gap: 8px; }
        .game-item { 
            padding: 8px 12px; 
            border: 1px solid var(--border); 
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .game-checkbox {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        .game-link {
            flex: 1;
            color: var(--text);
            text-decoration: none;
        }
        .game-link:hover {
            color: var(--accent);
        }
        .page-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .bulk-actions {
            display: flex;
            gap: 8px;
        }
        .center { text-align: center; }
        .subtitle.muted { color: var(--muted); }
        .in-collection {
            color: var(--muted);
            font-size: 0.875rem;
        }
    </style>
</head>
<body>
<div th:replace="fragments/header :: appHeader('Games')"></div>

<div class="container">
    <div class="grid">
        <div th:replace="fragments/sidebar :: appSidebar('games')"></div>
        <section class="content">
            <div class="page-toolbar">
                <div class="page-title">Game Library</div>
                <div class="bulk-actions">
                    <button type="button" id="selectAll" class="btn-ghost">Select All</button>
                    <button type="button" id="addBtn" class="btn-primary" disabled>Add Selected</button>
                </div>
            </div>

            <div class="card">
                <form id="addForm" method="post" th:action="@{/board-game-stat/games/add-to-user}">
                    <div class="games-list">
                        <div th:if="${#lists.isEmpty(games)}" class="center" style="padding: 28px 0;">
                            <div class="subtitle muted">No games available</div>
                        </div>
                        <div th:each="game : ${games}" class="game-item">
                            <input type="checkbox" 
                                   class="game-checkbox" 
                                   name="gameIds" 
                                   th:value="${game.id}"
                                   th:disabled="${userGameIds != null and userGameIds.contains(game.id)}"
                                   onchange="updateAddButton()">
                            <a th:href="@{/board-game-stat/games/{gameName}(gameName=${game.name})}"
                               class="game-link"
                               th:text="${game.name}">Game Name</a>
                            <span th:if="${userGameIds != null and userGameIds.contains(game.id)}"
                                  class="in-collection">(in collection)</span>
                        </div>
                    </div>
                </form>
            </div>
        </section>
    </div>
</div>

<script>
    function updateAddButton() {
        const checkboxes = document.querySelectorAll('.game-checkbox:checked:not([disabled])');
        const addBtn = document.getElementById('addBtn');
        addBtn.disabled = checkboxes.length === 0;
    }

    document.getElementById('selectAll').addEventListener('click', function() {
        const checkboxes = document.querySelectorAll('.game-checkbox:not([disabled])');
        const allChecked = Array.from(checkboxes).every(cb => cb.checked);
        checkboxes.forEach(cb => cb.checked = !allChecked);
        updateAddButton();
    });

    document.getElementById('addBtn').addEventListener('click', function() {
        document.getElementById('addForm').submit();
    });
</script>
</body>
</html>
