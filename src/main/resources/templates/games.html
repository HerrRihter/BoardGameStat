<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Games</title>
    <link rel="stylesheet" href="/css/user.css">
    <style>
        .games-list { display: grid; gap: 8px; }
        .game-item { padding: 8px 12px; border: 1px solid #e4e4e7; border-radius: 8px; }
        form.inline { display: flex; gap: 8px; align-items: center; }
        .muted-btn { opacity: 0.5; cursor: not-allowed; }
        .muted-input { opacity: 0.7; }
    </style>
</head>
<body>
<div th:replace="fragments/header :: appHeader('Games')"></div>

<div class="container">
    <div class="grid">
        <div th:replace="fragments/sidebar :: appSidebar('games')"></div>
        <section class="content">
            <div class="page-toolbar">
                <div class="page-title">Games</div>
            </div>

            <div class="card">
                <!-- My games -->
                <div>
                    <h3>My games</h3>
                    <div class="games-list">
                        <div th:if="${#lists.isEmpty(myGames)}" class="muted">No games in your collection</div>
                        <div th:each="g : ${myGames}" class="game-item">
                            <span th:text="${g.name}">Game Name</span>
                            <form method="post" th:action="@{/board-game-stat/games/remove-from-user}" style="display:inline;">
                                <input type="hidden" name="gameId" th:value="${g.id}" />
                                <button type="submit">Remove from collection</button>
                            </form>
                        </div>
                    </div>
                </div>
                <!-- Collapsed list of other games -->
                <details style="margin-top:1em;">
                    <summary>Add new games</summary>
                    <div class="games-list">
                        <div th:if="${#lists.isEmpty(otherGames)}" class="muted">No games available to add</div>
                        <div th:each="g : ${otherGames}" class="game-item">
                            <span th:text="${g.name}">Game Name</span>
                            <form method="post" th:action="@{/board-game-stat/games/add-to-user}">
                                <input type="hidden" name="gameId" th:value="${g.id}" />
                                <button type="submit">Add to my collection</button>
                            </form>
                        </div>
                    </div>
                </details>
            </div>
            <div th:if="${myGames == null && otherGames == null}" class="center" style="padding: 28px 0;">
                <div class="stack" style="align-items:center;">
                    <div class="subtitle muted">No games yet</div>
                </div>
            </div>
        </section>
    </div>
</div>
</body>
</html>
