<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title th:text="${game.name}">Game Details</title>
    <link rel="stylesheet" href="/css/user.css">
    <style>
        .game-detail {
            display: grid;
            gap: 20px;
        }
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 20px;
        }
        .game-title {
            font-size: 1.75rem;
            font-weight: 600;
            margin: 0;
        }
        .game-info {
            display: grid;
            gap: 12px;
        }
        .info-row {
            display: grid;
            grid-template-columns: 120px 1fr;
            gap: 12px;
            padding: 8px 0;
            border-bottom: 1px solid var(--border);
        }
        .info-label {
            color: var(--muted);
            font-weight: 500;
        }
        .info-value {
            color: var(--text);
        }
        .game-description {
            padding: 12px;
            background: var(--panel);
            border-radius: 8px;
            border: 1px solid var(--border);
            white-space: pre-wrap;
            line-height: 1.6;
        }
        .game-actions {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }
        .edit-form {
            display: none;
            margin-top: 20px;
        }
        .row {
            display: grid;
            gap: 8px;
            margin-bottom: 12px;
        }
        .row-inline {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
    </style>
    <script>
        function toggleEdit(on) {
            document.getElementById('view').style.display = on ? 'none' : '';
            document.getElementById('edit').style.display = on ? '' : 'none';
        }
    </script>
</head>
<body>
<div th:replace="fragments/header :: appHeader('Game Details')"></div>

<div class="container">
    <div class="grid">
        <div th:replace="fragments/sidebar :: appSidebar('admin-games')"></div>
        <section class="content">
            <div class="page-toolbar">
                <div class="page-title">Game Details</div>
            </div>

            <div class="card" id="view">
                <div class="game-detail">
                    <div class="game-header">
                        <h1 class="game-title" th:text="${game.name}">Game Name</h1>
                    </div>

                    <div class="game-info">
                        <div class="info-row" th:if="${game.gameType != null and !#strings.isEmpty(game.gameType)}">
                            <span class="info-label">Type:</span>
                            <span class="info-value" th:text="${game.gameType}">Game Type</span>
                        </div>

                        <div class="info-row" th:if="${game.minPlayers > 0 or game.maxPlayers > 0}">
                            <span class="info-label">Players:</span>
                            <span class="info-value">
                                <span th:if="${game.minPlayers > 0}" th:text="${game.minPlayers}">Min</span>
                                <span th:if="${game.minPlayers > 0 and game.maxPlayers > 0}"> - </span>
                                <span th:if="${game.maxPlayers > 0}" th:text="${game.maxPlayers}">Max</span>
                            </span>
                        </div>

                        <div class="info-row" th:if="${game.desc != null and !#strings.isEmpty(game.desc)}">
                            <span class="info-label">Description:</span>
                            <div class="info-value">
                                <div class="game-description" th:text="${game.desc}">Game description</div>
                            </div>
                        </div>
                    </div>

                    <div class="game-actions">
                        <button type="button" class="btn-primary" onclick="toggleEdit(true)">Edit</button>
                        <form method="post" 
                              th:action="@{/board-game-stat/admin/games/{gameId}/delete(gameId=${game.id})}"
                              style="display: inline;"
                              onsubmit="return confirm('Are you sure you want to delete this game from the system?');">
                            <button type="submit" class="btn-ghost" style="color: #ef4444;">Delete from System</button>
                        </form>
                        <a th:href="@{/board-game-stat/admin/games}" class="btn-ghost">Back to Games</a>
                    </div>
                </div>
            </div>

            <div class="card" id="edit" style="display:none;">
                <div class="title">Edit Game</div>
                <form method="post" th:action="@{/board-game-stat/admin/games/{gameId}/update(gameId=${game.id})}">
                    <div class="row">
                        <label for="game-name">Game name:</label>
                        <input id="game-name" name="name" type="text" th:value="${game.name}" required />
                    </div>

                    <div class="row">
                        <label for="game-type">Game type:</label>
                        <input id="game-type" name="gameType" type="text" th:value="${game.gameType}" required />
                    </div>

                    <div class="row">
                        <label for="game-desc">Description:</label>
                        <textarea id="game-desc" name="desc" rows="3" th:text="${game.desc}" required></textarea>
                    </div>

                    <div class="row row-inline">
                        <div>
                            <label for="min-players">Min players:</label>
                            <input id="min-players" name="minPlayers" type="number" min="1" step="1" th:value="${game.minPlayers}" required />
                        </div>
                        <div>
                            <label for="max-players">Max players:</label>
                            <input id="max-players" name="maxPlayers" type="number" min="1" step="1" th:value="${game.maxPlayers}" required />
                        </div>
                    </div>

                    <div class="actions">
                        <button type="submit" class="btn-primary">Save</button>
                        <button type="button" class="btn-ghost" onclick="toggleEdit(false)">Cancel</button>
                    </div>
                </form>
            </div>
        </section>
    </div>
</div>
</body>
</html>
